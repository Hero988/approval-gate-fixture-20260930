name: agent-approval-check
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing fixture PR number
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  check:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action/agent-approval-check@fd1c128679612beff4ca259c78021c506e8aa7a7
        env:
          GH_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          required_approvals: 2
          agent_emails: agent-fixture@example.invalid
          agent_logins: claude[bot],claude-code[bot]
          protected_bases: main,release
